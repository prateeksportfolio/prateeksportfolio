backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    format: "frontmatter"
    slug: "{{slug}}"
    editor:
      preview: false

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-friendly version, e.g. seo-audit-guide"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Prateek Sharma"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "SEO"
          - "AEO"
          - "GEO"
          - "AI Search"
          - "Content Marketing"
          - "Digital Marketing"
          - "Google Ads"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "Short summary used on blog cards and previews."

      - label: "Featured Image"
        name: "featured_image"
        widget: "image"
        required: false

      - label: "SEO Title"
        name: "seo_title"
        widget: "string"
        required: false
        hint: "Ideally around 50–60 characters."

      - label: "Meta Description"
        name: "meta_description"
        widget: "text"
        required: false
        hint: "Ideally around 140–160 characters."

      - label: "Body"
        name: "body"
        widget: "markdown"
